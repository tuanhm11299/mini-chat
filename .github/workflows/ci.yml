name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: mini_chat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat -d mini_chat"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGPASSWORD: chat

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, types
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Prepare databases
        run: |
          psql -h localhost -U chat -d mini_chat -c "CREATE DATABASE mini_chat_test"
          cp apps/api/.env.example apps/api/.env
          pnpm db:migrate

      - name: Entities and migrations are in sync
        run: pnpm --filter @mini-chat/api db:migration:check

      - name: API e2e tests
        run: pnpm --filter @mini-chat/api test:e2e

      - name: Build
        run: pnpm build

      - name: Browser e2e tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

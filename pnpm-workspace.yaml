packages:
  - apps/*
  - packages/*

# Which dependencies may run install scripts (native builds). Everything else is skipped.
allowBuilds:
  '@parcel/watcher': true
  argon2: true
  esbuild: true
  sharp: true
  '@nestjs/core': false
  '@scarf/scarf': false
  unrs-resolver: false
  vue-demi: false
